# Acting-node compose: the node that runs hooks. Besides what every member needs (data/, the
# checkout's hooks/ and config/), the hooks need whatever they drive: the docker socket, ssh keys
# and the service's directories mounted at the SAME host paths (so paths inside hooks resolve on
# the host). Adapt the mounts to your hooks; `compose.yaml` in the repo root is a plain member.
#
# Secrets: ./.env (0600, owned by uid 1000) — NODE_NAME, STATE_DIR, LOG_DIR and whatever your
# hooks read through $SN_ENV (see .env.example). Compose interpolates the ${VAR:-default} knobs
# below from the invoking shell or the project .env:
#   DOCKER_GID        gid of the host's docker group so uid 1000 may use the socket
#   SERVICE_ROOT      the service's directory (data, replicas, scratch) the hooks work in
#   SSH_DIR           ssh keys the hooks use to reach the other hosts
#   CA_FILE           a CA bundle for privately signed https endpoints (optional)
services:
  sentinel:
    image: ${SENTINEL_IMAGE:-ghcr.io/rojosinalma/sentinel}:${SENTINEL_TAG:-0.5.2}
    pull_policy: missing
    container_name: sentinel
    restart: unless-stopped
    user: "1000:1000"
    group_add:
      - "${DOCKER_GID:-999}"
    environment:
      RACK_ENV: production
      PORT: "9292"
      HOME: ${HOME}
      TZ: ${TZ:-UTC}
    ports:
      - "4197:9292"
    volumes:
      - ./.env:/app/.env:ro
      - ./data:/app/data
      # hooks from the checkout (docs/hooks.md); create_host_path keeps a missing dir from being
      # masked by an empty one
      - type: bind
        source: ./hooks
        target: /app/hooks
        read_only: true
        bind:
          create_host_path: false
      # cluster.yml from the checkout too: a voter change is a file drop + restart, no release
      - type: bind
        source: ./config
        target: /app/config
        read_only: true
        bind:
          create_host_path: false
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${SERVICE_ROOT:-/srv/app}
        target: ${SERVICE_ROOT:-/srv/app}
        bind:
          create_host_path: false
      - type: bind
        source: ${SSH_DIR:-${HOME}/.ssh}
        target: ${HOME}/.ssh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CA_FILE:-./data/ca.pem}
        target: /etc/ssl/certs/private-ca.pem
        read_only: true
        bind:
          create_host_path: false
