name: Feature request
description: Propose a change or an addition
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that sentinel does not let you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work? A tunable, a probe type, a hook environment variable, a route mode, a dashboard view…
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Probes / classification
        - Decider / lease / quorum
        - Hooks contract
        - Routes
        - Dashboard / UI
        - HTTP API / MCP
        - Notifications
        - Docker / deployment
        - Other
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I searched existing issues.
