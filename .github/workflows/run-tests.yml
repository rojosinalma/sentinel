name: run-tests
run-name: ${{ github.event.pull_request.title || github.event.head_commit.message }} · ${{ github.actor }}

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends iputils-ping
      - run: bundle exec rake test
