# node-a instance (NODE_NAME=node-a) — base compose owned by this repo, handed to the orchestrator
# with PUT /api/services/:id/compose at the phase-4 cutover (the orchestrator adds Traefik/homepage
# labels in compose.override.yaml). Port 4197 is the cluster port: guards, gossip and Gatus all
# speak to <host>:4197. Node-a is not the acting node, so no docker socket / ssh mounts here.
services:
  sentinel:
    image: registry.example.com/sentinel:${SENTINEL_TAG:-0.4.4}
    container_name: sentinel
    restart: unless-stopped
    environment:
      RACK_ENV: production
      PORT: "9292"
    ports:
      - "4197:9292"
    volumes:
      - ./.env:/app/.env:ro
      - ./data:/app/data
      # hooks come from the checkout, not the image (the image's copy is only the fallback when
      # this mount is removed): a new hooks/<service>/ is a file drop, not a release
      - type: bind
        source: ./hooks
        target: /app/hooks
        read_only: true
        bind:
          create_host_path: false
      # cluster.yml from the checkout too: a voter change is a file drop + restart, no release
      - type: bind
        source: ./config
        target: /app/config
        read_only: true
        bind:
          create_host_path: false
    networks:
      - default
      - traefik-proxy

networks:
  default: {}
  traefik-proxy:
    external: true
