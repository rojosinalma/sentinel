# Member-node compose (one sentinel per host; NODE_NAME in ./.env picks this node's row in
# config/cluster.yml). Port 4197 is the cluster port: peers, consumers and health checks all speak
# to <host>:4197. A node that only votes and probes needs no docker socket or ssh mounts — the
# acting node (the one running hooks) starts from examples/acting-node/compose.yaml instead.
services:
  sentinel:
    image: ${SENTINEL_IMAGE:-ghcr.io/rojosinalma/sentinel}:${SENTINEL_TAG:-0.5.6}
    container_name: sentinel
    restart: unless-stopped
    environment:
      RACK_ENV: production
      PORT: "9292"
    ports:
      - "4197:9292"
    volumes:
      - ./.env:/app/.env:ro
      - ./data:/app/data
      # hooks come from the checkout, not the image (the image's copy is only the fallback when
      # this mount is removed): a new hooks/<service>/ is a file drop, not a release
      - type: bind
        source: ./hooks
        target: /app/hooks
        read_only: true
        bind:
          create_host_path: false
      # cluster.yml from the checkout too: a voter change is a file drop + restart, no release
      - type: bind
        source: ./config
        target: /app/config
        read_only: true
        bind:
          create_host_path: false
